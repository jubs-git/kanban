<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quadro Kanban - SESI</title>
  <style>
    body { font-family: Arial, sans-serif; background-color: #f0f2f5; margin: 20px; }
    h1 { color: #333; text-align: center; }
    .kanban-container { display: flex; gap: 20px; justify-content: center; }
    .board {
      flex: 1;
      max-width: 400px;
      background-color: #e2e8f0;
      border-radius: 8px;
      padding: 15px;
      min-height: 300px;
      border: 2px dashed #cbd5e1;
    }
    .board h2 { font-size: 18px; margin-top: 0; color: #1e293b; text-align: center; }
    .card {
      background-color: #0284c7;
      color: white;
      padding: 12px;
      margin-bottom: 10px;
      border-radius: 6px;
      cursor: grab;
      font-weight: bold;
    }
    .card:active { cursor: grabbing; }
    .hovered { background-color: #cbd5e1; border-color: #0284c7; }
  </style>
</head>
<body>
  <h1>Quadro Kanban - SESI</h1>
  <div class="kanban-container">
    <div class="board" id="board1">
      <h2>Coluna 1</h2>
      <div class="card" draggable="true" id="card1">Javascript Prof.Pety</div>
      <div class="card" draggable="true" id="card2">Modelar Banco de Dados Prof. Jonh</div>
      <div class="card" draggable="true" id="card3">Criar API REST</div>
    </div>
    <div class="board" id="board2">
      <h2>Coluna 2</h2>
    </div>
  </div>

  <script>
    const cards = document.querySelectorAll('.card');
    const boards = document.querySelectorAll('.board');

    cards.forEach(card => {
      card.addEventListener('dragstart', (e) => {
        e.dataTransfer.setData('text/plain', card.id);
      });
    });

    boards.forEach(board => {
      board.addEventListener('dragover', (e) => {
        e.preventDefault();
        board.classList.add('hovered');
      });

      board.addEventListener('dragleave', () => {
        board.classList.remove('hovered');
      });

      board.addEventListener('drop', (e) => {
        e.preventDefault();
        board.classList.remove('hovered');
        const cardId = e.dataTransfer.getData('text/plain');
        const card = document.getElementById(cardId);
        if (card) {
          board.appendChild(card);
        }
      });
    });
  </script>
</body>
</html>
